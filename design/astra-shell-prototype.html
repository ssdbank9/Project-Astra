<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Astra UX Shell Prototype — Throwaway</title>
  <style>
    /* THROWAWAY PROTOTYPE for JQY55P. No production API calls or persistence. */
    :root{
      --ink:#142033;--muted:#647085;--line:#dfe5ec;--paper:#fff;--canvas:#f4f6f9;
      --teal:#087f83;--teal-2:#14a7a8;--navy:#142a45;--amber:#e9a23b;--red:#db4b5a;
      --green:#168466;--violet:#7157d9;--shadow:0 18px 55px rgba(20,42,69,.14);
      --r:14px;--ease:cubic-bezier(.22,1,.36,1);font-family:Inter,"Segoe UI",system-ui,sans-serif;
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink)}
    body{min-width:920px}button,input{font:inherit}button{cursor:pointer}
    button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #55c8ff;outline-offset:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .prototype-banner{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:80;padding:6px 12px;border:1px solid #ffffff55;border-radius:999px;background:#0e1726dc;color:#fff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(12px);box-shadow:0 8px 24px #0002}
    .shell{min-height:100vh;display:grid;overflow:hidden}.topbar{display:flex;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.14em}.brand-mark{width:31px;height:31px;border-radius:10px;background:linear-gradient(145deg,#40e0d0,#0d7f91 60%,#7c5cff);box-shadow:0 7px 20px #20aeb866;display:grid;place-items:center;color:#fff;font-size:13px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:linear-gradient(145deg,#fee2b8,#ef9b4a);color:#653600}.icon-btn,.ghost,.primary,.soft,.danger{border:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s var(--ease)}.icon-btn{width:36px;height:36px;background:transparent;color:inherit}.icon-btn:hover,.ghost:hover{background:#0000000d;transform:translateY(-1px)}.primary{padding:10px 15px;background:var(--teal);color:#fff;font-weight:760;box-shadow:0 8px 22px #087f8333}.primary:hover{background:#066d70;transform:translateY(-2px);box-shadow:0 11px 26px #087f8344}.soft{padding:8px 12px;background:#eef4f5;color:#17666a;font-weight:700}.ghost{padding:8px 10px;background:transparent;color:inherit}.danger{padding:9px 12px;background:#fff0f1;color:#b82f42;font-weight:700}.badge,.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:11px;font-weight:760;white-space:nowrap}.badge{padding:4px 8px;border:1px solid currentColor}.pill{padding:5px 9px}.teal{color:#087f83;background:#e6f6f5}.red{color:#b83445;background:#fff0f1}.amber{color:#9a6010;background:#fff4df}.green{color:#106e55;background:#e7f6f0}.violet{color:#6042c5;background:#f0ecff}.blue{color:#2465ad;background:#eaf3ff}.gray{color:#637083;background:#eef1f5}
    .search{display:flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:9px 12px}.search input{border:0;outline:0;background:transparent;color:inherit;width:100%}.search kbd{font-size:10px;border:1px solid #ffffff38;border-radius:5px;padding:2px 5px}.view-tabs{display:flex;align-items:center;gap:3px}.view-tab{border:0;background:transparent;color:inherit;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:720}.view-tab.active{background:#fff;color:var(--ink);box-shadow:0 3px 12px #10263b18}.mini-dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px #db4b5a20}.count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:var(--red);color:#fff;font-size:10px;font-weight:800}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 18px rgba(20,42,69,.055)}
    .task-title{font-weight:760}.meta{color:var(--muted);font-size:12px}.progress{height:6px;border-radius:99px;background:#e7ebf0;overflow:hidden}.progress>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--teal),#4ad0c6)}
    .task-row,.board-card,.timeline-row{transition:.18s var(--ease)}.task-row:hover,.board-card:hover{transform:translateY(-2px);border-color:#96cfd0;box-shadow:0 12px 28px rgba(20,42,69,.11)}
    .drawer{position:fixed;z-index:42;background:#fff;box-shadow:-20px 0 60px #13294430;overflow:auto;transition:.3s var(--ease)}.drawer[hidden]{display:block;visibility:hidden;opacity:0;transform:translateX(42px);pointer-events:none}.drawer:not([hidden]){visibility:visible;opacity:1;transform:none}.drawer-head{position:sticky;top:0;z-index:2;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:16px 19px;display:flex;justify-content:space-between;align-items:center}.drawer-body{padding:20px}.drawer.full{inset:24px!important;width:auto!important;height:auto!important;border-radius:20px}.section{padding:17px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0}.section h3{margin:0 0 11px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#728096}.fact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.fact{padding:10px;border-radius:10px;background:#f6f8fa}.fact span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#7b8798}.fact strong{display:block;margin-top:4px;font-size:13px}.attachment{border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0;background:#fff}.attachment-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.attachment-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.timeline-event{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:8px 0;font-size:12px}.timeline-event i{width:10px;height:10px;border-radius:50%;background:var(--teal);margin-top:4px;box-shadow:0 0 0 4px #0c8b8f18}
    .dialog-backdrop{position:fixed;inset:0;z-index:70;background:#111b2c88;display:grid;place-items:center;backdrop-filter:blur(5px);animation:fade .16s ease}.dialog-backdrop[hidden]{display:none}.dialog{width:min(470px,calc(100vw - 40px));background:#fff;border-radius:18px;box-shadow:0 30px 90px #0005;padding:22px;animation:pop .25s var(--ease)}.dialog h2{margin:0 0 7px;font-size:20px}.dialog p{color:var(--muted);line-height:1.55}.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast-stack{position:fixed;z-index:90;right:20px;bottom:80px;display:grid;gap:8px}.toast{width:330px;background:#102438;color:#fff;border:1px solid #ffffff25;border-radius:13px;padding:13px 15px;box-shadow:0 18px 50px #0004;animation:toastIn .28s var(--ease)}
    .prototype-switcher{position:fixed;z-index:100;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;background:#0d1727e8;color:#fff;border:1px solid #ffffff25;border-radius:999px;box-shadow:0 16px 50px #0005;backdrop-filter:blur(16px)}.prototype-switcher button{border:0;background:transparent;color:#fff;border-radius:999px;padding:9px 12px}.prototype-switcher button:hover{background:#ffffff18}.variant-label{min-width:205px;text-align:center;font-size:12px;font-weight:760}.prototype-switcher .notes{color:#7fe1dd}
    .evaluation{position:fixed;z-index:75;right:18px;bottom:76px;width:380px;max-height:calc(100vh - 110px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}.evaluation[hidden]{display:none}.evaluation h2{font-size:18px;margin:0 0 5px}.evaluation h3{font-size:13px;margin:17px 0 5px}.evaluation p,.evaluation li{font-size:12px;line-height:1.55;color:var(--muted)}
    @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}@keyframes fade{from{opacity:0}}@keyframes toastIn{from{opacity:0;transform:translateY(14px)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

    /* A — Command Center: dense, elegant, operational */
    .variant-a{grid-template-columns:226px minmax(0,1fr);grid-template-rows:60px 1fr;background:#f4f6f9}.variant-a .topbar{grid-column:1/-1;background:#132b47;color:#fff;padding:0 18px}.variant-a .search{width:min(460px,40vw);margin:auto;background:#203c5a;color:#dce7f2}.variant-a .sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 12px;overflow:auto}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#94a0b0;font-weight:800;padding:14px 11px 6px}.nav-item{border:0;width:100%;background:transparent;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:#415066;text-align:left;font-weight:650;font-size:12px}.nav-item:hover{background:#f1f5f7}.nav-item.active{background:#e6f5f4;color:#076e72}.nav-item svg{width:16px;height:16px}.variant-a .main{min-width:0;overflow:auto;padding:20px}.context-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.eyebrow{font-size:11px;color:#7a8798;font-weight:720}.context-head h1{font-size:23px;margin:3px 0 4px}.head-actions{display:flex;align-items:center;gap:8px}.metric-strip{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;margin:18px 0}.metric{padding:14px 15px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-35px;top:-35px;background:var(--metric,#0c8b8f);opacity:.12}.metric b{font-size:23px}.metric span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.work-card{overflow:hidden}.work-toolbar{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:11px;color:#526176}.task-table{width:100%;border-collapse:collapse}.task-table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8a96a7;text-align:left;padding:10px 14px;background:#f8f9fb}.task-table td{padding:12px 14px;border-top:1px solid #edf0f4;font-size:12px}.task-row{cursor:pointer}.task-row.selected{background:#edf8f7}.variant-a .drawer{right:0;top:60px;bottom:0;width:440px;border-left:1px solid var(--line)}

    /* B — Focus Workspace: calm, editorial, progressive disclosure */
    .variant-b{grid-template-columns:72px minmax(0,1fr);background:#f6f2eb;color:#233035}.variant-b .topbar{position:fixed;left:72px;right:0;top:0;height:72px;padding:0 28px;z-index:15;background:#f6f2ebdf;backdrop-filter:blur(14px);border-bottom:1px solid #dcd5c9}.variant-b .brand{color:#183f3a}.variant-b .search{margin-left:auto;width:300px;background:#fff;border-color:#ded8cd}.rail{position:fixed;inset:0 auto 0 0;width:72px;background:#183f3a;color:#e9f1ed;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:9px;z-index:20}.rail .brand-mark{margin-bottom:16px}.rail button{width:44px;height:44px;border:0;border-radius:13px;background:transparent;color:#d5e5df;font-size:18px}.rail button.active,.rail button:hover{background:#ffffff18;transform:translateY(-1px)}.variant-b .main{grid-column:2;padding:105px 6vw 110px;overflow:auto}.focus-title{max-width:900px;margin:auto}.focus-title .eyebrow{color:#8a745b}.focus-title h1{font-family:Georgia,serif;font-size:43px;font-weight:500;letter-spacing:-.03em;margin:6px 0 8px;color:#183f3a}.focus-title p{color:#6c675f;font-size:14px;line-height:1.6;max-width:690px}.focus-bar{max-width:900px;margin:24px auto 14px;display:flex;align-items:center;justify-content:space-between}.variant-b .view-tabs{background:#ebe5da;padding:4px;border-radius:12px}.focus-surface{max-width:900px;margin:auto}.focus-list{display:grid;gap:10px}.focus-item{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:12px;padding:16px 17px;border-radius:15px;border:1px solid #ded8cd;background:#fffdf9;cursor:pointer}.focus-item .check{width:25px;height:25px;border-radius:50%;border:2px solid #b9c7c0;display:grid;place-items:center}.focus-item.selected{border-color:#3b8d82;box-shadow:0 12px 30px #315f5418}.focus-item.selected .check{background:#183f3a;border-color:#183f3a;color:#fff}.variant-b .drawer{right:22px;top:88px;bottom:78px;width:430px;border:1px solid #d8d2c7;border-radius:20px}.command-dock{position:fixed;z-index:18;left:50%;bottom:76px;transform:translateX(-50%);display:flex;gap:5px;padding:7px;background:#183f3a;color:#fff;border-radius:16px;box-shadow:0 16px 45px #173c3644}.command-dock button{border:0;background:transparent;color:#fff;padding:9px 13px;border-radius:10px}.command-dock button:hover{background:#ffffff18}

    /* C — Executive Cockpit: top-nav, insight-led, spatial */
    .variant-c{grid-template-rows:68px 1fr;background:radial-gradient(circle at 20% 0,#182b52,#0b1427 47%);color:#f3f6fc}.variant-c .topbar{padding:0 24px;background:#0a1425bb;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff14}.variant-c .search{margin-left:auto;width:330px;background:#ffffff0d;border-color:#ffffff18;color:#fff}.top-nav{display:flex;gap:4px;margin-left:28px}.top-nav button{border:0;background:transparent;color:#afbdd2;padding:10px 12px;border-radius:9px;font-size:12px;font-weight:700}.top-nav button.active,.top-nav button:hover{background:#ffffff12;color:#fff}.variant-c .main{padding:22px 28px 105px;overflow:auto}.cockpit-head{display:flex;justify-content:space-between;align-items:end}.cockpit-head h1{font-size:27px;margin:5px 0}.cockpit-head .eyebrow{color:#88a0c3}.health-grid{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:12px;margin:18px 0}.glass{background:linear-gradient(145deg,#ffffff12,#ffffff07);border:1px solid #ffffff16;box-shadow:0 18px 60px #0002;border-radius:16px;backdrop-filter:blur(14px)}.health-hero{padding:18px;display:flex;align-items:center;gap:18px}.orb{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#3bd7b6 0 72%,#ffffff15 72%);position:relative}.orb:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#142342}.orb strong{position:relative;z-index:1;font-size:18px}.health-stat{padding:17px}.health-stat b{font-size:26px}.health-stat span{display:block;color:#aab8cc;font-size:11px;margin-top:5px}.cockpit-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.7fr);gap:14px}.mission{padding:16px;min-width:0}.mission-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.mission-head h2{font-size:14px;margin:0}.variant-c .view-tabs{background:#ffffff0b;padding:3px;border-radius:10px}.variant-c .view-tab.active{background:#fff;color:#101c31}.cockpit-tasks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cockpit-task{padding:13px;border-radius:12px;background:#ffffff0a;border:1px solid #ffffff12;cursor:pointer}.cockpit-task:hover{background:#ffffff13;transform:translateY(-2px)}.cockpit-task .meta{color:#9eb0c8}.signal-panel{padding:16px}.signal-panel h2{font-size:14px;margin:0 0 12px}.signal{padding:11px 0;border-top:1px solid #ffffff10;display:grid;grid-template-columns:9px 1fr;gap:9px}.signal:first-of-type{border-top:0}.signal p{font-size:12px;margin:0;line-height:1.45;color:#c2cde0}.signal time{font-size:10px;color:#7f93b2}.variant-c .drawer{right:18px;top:84px;bottom:72px;width:450px;border:1px solid #ffffff20;border-radius:18px;color:var(--ink)}

    body[data-variant="A"] .drawer{right:0;top:60px;bottom:0;width:440px;border-left:1px solid var(--line)}
    body[data-variant="B"] .drawer{right:22px;top:88px;bottom:78px;width:430px;border:1px solid #d8d2c7;border-radius:20px}
    body[data-variant="C"] .drawer{right:18px;top:84px;bottom:72px;width:450px;border:1px solid #ffffff20;border-radius:18px;color:var(--ink)}
    .board{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:10px;padding:12px}.board-col{background:#f6f8fa;border-radius:12px;padding:10px}.board-col h3{font-size:11px;text-transform:uppercase;color:#728096;margin:3px 4px 9px}.board-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0;cursor:pointer}.timeline{padding:16px;min-width:720px}.timeline-row{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:12px;height:52px;border-top:1px solid var(--line)}.gantt{height:26px;border-radius:7px;background:linear-gradient(90deg,var(--teal),#36cbb7);box-shadow:0 7px 16px #087f8330;position:relative}.gantt:after{content:attr(data-progress);position:absolute;right:7px;top:5px;color:#fff;font-size:10px;font-weight:800}.variant-c .board-col{background:#ffffff08}.variant-c .board-col h3{color:#b7c4d7}.variant-c .board-card{background:#ffffff0a;border-color:#ffffff15}.variant-c .timeline-row{border-color:#ffffff12}.variant-c .meta{color:#9fb0c8}
    @media(max-width:1100px){.metric-strip{grid-template-columns:repeat(2,1fr)}.variant-a{grid-template-columns:190px minmax(0,1fr)}.variant-a .main{padding:16px}.task-table th:nth-child(4),.task-table td:nth-child(4){display:none}.health-grid{grid-template-columns:1.3fr repeat(3,.75fr)}.cockpit-grid{grid-template-columns:1fr}.signal-panel{display:none}.focus-title h1{font-size:36px}.variant-b .main{padding-left:4vw;padding-right:4vw}.variant-c .main{padding-left:18px;padding-right:18px}}
  </style>
</head>
<body>
  <div class="prototype-banner">Throwaway UX prototype · no data is saved</div>
  <main id="app" aria-live="polite"></main>
  <section class="drawer" id="drawer" hidden aria-label="Task details"></section>
  <section class="evaluation" id="evaluation" hidden aria-label="Variant evaluation"></section>
  <div class="dialog-backdrop" id="dialog" hidden></div>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>
  <nav class="prototype-switcher" aria-label="Prototype variants">
    <button type="button" id="prevVariant" aria-label="Previous variant">←</button>
    <div class="variant-label" id="variantLabel"></div>
    <button type="button" id="nextVariant" aria-label="Next variant">→</button>
    <button type="button" class="notes" id="showNotes">Why?</button>
  </nav>
  <script>
  (()=>{
    "use strict";
    const variants={A:"Command Center · recommended",B:"Focus Workspace",C:"Executive Cockpit"};
    const tasks=[
      {id:"t1",title:"Submit Q3 audit response",project:"FY26 Audit",owner:"Sara Karim",due:"10 Sep",state:"Submitted",crit:"Critical",progress:78,section:"In review"},
      {id:"t2",title:"Reconcile grant utilization",project:"BMGF Closeout",owner:"Hassan Ali",due:"18 Sep",state:"In progress",crit:"High",progress:54,section:"In progress"},
      {id:"t3",title:"Approve safeguarding protocol",project:"Field Operations",owner:"Mariam Noor",due:"22 Sep",state:"Blocked",crit:"High",progress:31,section:"Blocked"},
      {id:"t4",title:"Publish board action register",project:"Governance",owner:"Aly Jafferani",due:"26 Sep",state:"Draft",crit:"Normal",progress:24,section:"Planned"},
      {id:"t5",title:"Verify annual return evidence",project:"Compliance",owner:"Usman Tariq",due:"30 Sep",state:"In progress",crit:"Normal",progress:62,section:"In progress"},
      {id:"t6",title:"Archive accepted deliverables",project:"FY26 Audit",owner:"Sara Karim",due:"3 Oct",state:"Draft",crit:"Low",progress:12,section:"Planned"}
    ];
    const state={variant:"A",view:"List",selected:"t1",role:"App Owner",drawer:true,full:false};
    const icons={
      search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
      grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
      list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
      inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v14H4z"/><path d="M4 14h5l2 2h2l2-2h5"/></svg>',
      user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>'
    };
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const task=()=>tasks.find(t=>t.id===state.selected)||tasks[0];
    function viewTabs(){return `<div class="view-tabs" role="tablist">${["List","Board","Timeline"].map(v=>`<button class="view-tab ${state.view===v?"active":""}" data-view="${v}" role="tab" aria-selected="${state.view===v}">${v}</button>`).join("")}</div>`}
    function listView(kind="table"){
      if(kind==="focus") return `<div class="focus-list">${tasks.map((t,i)=>`<article class="focus-item ${t.id===state.selected?"selected":""}" data-task="${t.id}" tabindex="0"><div class="check">${i===0?"✓":""}</div><div><div class="task-title">${esc(t.title)}</div><div class="meta">${esc(t.project)} · ${esc(t.owner)}</div></div><div><span class="pill ${t.crit==="Critical"?"red":t.crit==="High"?"amber":"gray"}">${t.crit}</span><div class="meta" style="text-align:right;margin-top:5px">Due ${t.due}</div></div></article>`).join("")}</div>`;
      return `<table class="task-table"><thead><tr><th>Task</th><th>Owner</th><th>Due</th><th>Status</th><th>Criticality</th><th>Progress</th></tr></thead><tbody>${tasks.map(t=>`<tr class="task-row ${t.id===state.selected?"selected":""}" data-task="${t.id}" tabindex="0"><td><div class="task-title">${esc(t.title)}</div><div class="meta">${esc(t.project)}</div></td><td>${esc(t.owner)}</td><td>${t.due}</td><td><span class="pill ${t.state==="Blocked"?"red":t.state==="Submitted"?"violet":"blue"}">${t.state}</span></td><td><span class="pill ${t.crit==="Critical"?"red":t.crit==="High"?"amber":"gray"}">${t.crit}</span></td><td style="width:130px"><div class="progress"><i style="width:${t.progress}%"></i></div><div class="meta" style="margin-top:4px">${t.progress}%</div></td></tr>`).join("")}</tbody></table>`;
    }
    function boardView(){const cols=["Planned","In progress","In review","Blocked"];return `<div class="board">${cols.map(c=>`<section class="board-col"><h3>${c} · ${tasks.filter(t=>t.section===c).length}</h3>${tasks.filter(t=>t.section===c).map(t=>`<article class="board-card" data-task="${t.id}" tabindex="0"><div class="task-title">${esc(t.title)}</div><div class="meta" style="margin:5px 0 9px">${esc(t.project)}</div><div style="display:flex;justify-content:space-between;align-items:center"><span class="pill ${t.crit==="Critical"?"red":t.crit==="High"?"amber":"gray"}">${t.crit}</span><span class="meta">${t.due}</span></div></article>`).join("")||`<div class="meta" style="padding:12px">No tasks</div>`}</section>`).join("")}</div>`}
    function timelineView(){return `<div class="timeline">${tasks.map((t,i)=>`<div class="timeline-row" data-task="${t.id}" tabindex="0"><div><div class="task-title">${esc(t.title)}</div><div class="meta">${t.owner}</div></div><div class="gantt" data-progress="${t.progress}%" style="margin-left:${i*4}%;width:${Math.max(30,t.progress-i*3)}%"></div></div>`).join("")}</div>`}
    const surface=(kind)=>state.view==="Board"?boardView():state.view==="Timeline"?timelineView():listView(kind);
    function commonTop(light=false){return `<header class="topbar"><div class="brand"><span class="brand-mark">A</span><span>ASTRA</span></div>${state.variant==="C"?`<nav class="top-nav"><button class="active">Work</button><button>Strategy</button><button>People</button></nav>`:""}<label class="search"><span style="width:16px">${icons.search}</span><input aria-label="Global search" placeholder="Search tasks, projects, people…"><kbd>/</kbd></label><button class="icon-btn" data-action="inbox" aria-label="Inbox">${icons.inbox}<span class="sr-only">3 unread</span></button><span class="count">3</span><button class="ghost" data-action="role" title="Switch prototype role"><span class="avatar">AJ</span><span>${state.role}</span></button></header>`}
    function variantA(){return `<div class="shell variant-a">${commonTop()}<aside class="sidebar"><div class="nav-label">Workspace</div><button class="nav-item active">${icons.grid}Portfolio</button><button class="nav-item">${icons.user}My work <span class="count" style="margin-left:auto">7</span></button><button class="nav-item">${icons.inbox}Inbox <span class="count" style="margin-left:auto">3</span></button><div class="nav-label">Entities</div><button class="nav-item">⌄ Ibn Sina Foundation</button><button class="nav-item active" style="padding-left:30px">FY26 Audit</button><button class="nav-item" style="padding-left:30px">Accreditation</button><button class="nav-item">› Rupani Foundation</button><button class="nav-item">› RDI Pakistan</button><div class="nav-label">Library</div><button class="nav-item">◇ Final results</button><button class="nav-item">◫ Templates</button></aside><section class="main"><div class="context-head"><div><div class="eyebrow">Ibn Sina Foundation / Active projects</div><h1>FY26 Audit</h1><div style="display:flex;gap:6px"><span class="badge teal">${state.role}</span><span class="badge gray">Private project</span></div></div><div class="head-actions"><button class="ghost">Share</button><button class="primary" data-action="create">＋ New task</button></div></div><div class="metric-strip"><div class="metric card" style="--metric:#087f83"><b>24</b><span>Open tasks</span></div><div class="metric card" style="--metric:#db4b5a"><b>3</b><span>Overdue</span></div><div class="metric card" style="--metric:#e9a23b"><b>5</b><span>High or critical</span></div><div class="metric card" style="--metric:#7157d9"><b>72%</b><span>Schedule health</span></div></div><div class="work-card card"><div class="work-toolbar">${viewTabs()}<div class="filters"><button class="filter">Open only</button><button class="filter">Criticality ▾</button><button class="filter">Owner ▾</button><button class="filter">Clear</button></div></div>${surface("table")}</div></section></div>`}
    function variantB(){return `<div class="shell variant-b"><aside class="rail"><span class="brand-mark">A</span><button class="active" title="Projects">⌂</button><button title="My work">✓</button><button data-action="inbox" title="Inbox">✦</button><button title="Final results">◇</button><button title="People">♙</button><button style="margin-top:auto" data-action="role" title="Switch role"><span class="avatar">AJ</span></button></aside>${commonTop(true)}<section class="main"><div class="focus-title"><div class="eyebrow">FY26 AUDIT · IBN SINA FOUNDATION</div><h1>Work that needs attention.</h1><p>A quieter workspace that reveals depth only when you ask. Six open items are arranged by consequence, not noise.</p></div><div class="focus-bar">${viewTabs()}<div style="display:flex;gap:7px"><span class="badge teal">${state.role}</span><button class="primary" data-action="create">Add task</button></div></div><div class="focus-surface">${surface("focus")}</div><div class="command-dock"><button data-view="List">☷ List</button><button data-view="Board">▦ Board</button><button data-view="Timeline">⌁ Timeline</button><button data-action="create">＋ Create</button><button data-action="inbox">✦ Inbox</button></div></section></div>`}
    function variantC(){return `<div class="shell variant-c">${commonTop()}<section class="main"><div class="cockpit-head"><div><div class="eyebrow">OPERATING PICTURE · AS OF 19 SEP 2026, 11:18 PKT</div><h1>Governance Command</h1><div style="display:flex;gap:6px"><span class="badge" style="color:#6ce0ce">${state.role}</span><span class="badge" style="color:#a9bbd5">5 entities · 12 active projects</span></div></div><button class="primary" data-action="create">＋ Create work</button></div><div class="health-grid"><div class="health-hero glass"><div class="orb"><strong>72</strong></div><div><b>Portfolio health</b><div class="meta" style="color:#9eb0c8;margin-top:5px">Stable, with three items requiring intervention</div></div></div><div class="health-stat glass"><b style="color:#ff7786">3</b><span>Overdue actions</span></div><div class="health-stat glass"><b style="color:#f7bd61">5</b><span>High consequence</span></div><div class="health-stat glass"><b style="color:#69dfc6">18</b><span>Closed this month</span></div></div><div class="cockpit-grid"><section class="mission glass"><div class="mission-head"><div><h2>FY26 Audit · Mission board</h2><div class="meta">One model, three working views</div></div>${viewTabs()}</div>${state.view==="List"?`<div class="cockpit-tasks">${tasks.map(t=>`<article class="cockpit-task" data-task="${t.id}" tabindex="0"><span class="pill ${t.crit==="Critical"?"red":t.crit==="High"?"amber":"gray"}">${t.crit}</span><div class="task-title" style="margin:10px 0 6px">${esc(t.title)}</div><div class="meta">${t.owner} · ${t.due}</div><div class="progress" style="margin-top:11px"><i style="width:${t.progress}%"></i></div></article>`).join("")}</div>`:surface("table")}</section><aside class="signal-panel glass"><h2>Signals</h2><div class="signal"><span class="mini-dot"></span><div><p>Final-result attachment removal blocked for <b>Submit Q3 audit response</b>.</p><time>4 minutes ago</time></div></div><div class="signal"><span class="mini-dot" style="background:#e9a23b"></span><div><p>Schedule proposal awaits your decision.</p><time>32 minutes ago</time></div></div><div class="signal"><span class="mini-dot" style="background:#3bd7b6"></span><div><p>Grant utilization reconciliation moved to 54%.</p><time>1 hour ago</time></div></div><button class="ghost" data-action="inbox" style="color:#78ddd0;margin-top:8px">Open Inbox →</button></aside></div></section></div>`}
    function render(){
      state.variant=(new URLSearchParams(location.search).get("variant")||state.variant).toUpperCase();if(!variants[state.variant])state.variant="A";
      document.body.dataset.variant=state.variant;document.getElementById("app").innerHTML=state.variant==="A"?variantA():state.variant==="B"?variantB():variantC();
      document.getElementById("variantLabel").textContent=`${state.variant} · ${variants[state.variant]}`;
      renderDrawer();wire();
    }
    function renderDrawer(){const t=task(),d=document.getElementById("drawer");d.hidden=!state.drawer;d.classList.toggle("full",state.full);if(!state.drawer)return;d.innerHTML=`<div class="drawer-head"><div><div class="meta">${esc(t.project)}</div><strong>Task detail</strong></div><div><button class="icon-btn" data-action="full" title="${state.full?"Restore":"Full page"}">${state.full?"↙":"↗"}</button><button class="icon-btn" data-action="close" aria-label="Close task">×</button></div></div><div class="drawer-body"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill ${t.crit==="Critical"?"red":"amber"}">${t.crit}</span><span class="badge teal">${state.role}</span></div><h2 style="font-size:22px;line-height:1.25;margin:12px 0 6px">${esc(t.title)}</h2><p class="meta">Prepare and file the final response with reconciled evidence. Governance actions remain explicit and audited.</p><div class="fact-grid section"><div class="fact"><span>Accountable owner</span><strong>${esc(t.owner)}</strong></div><div class="fact"><span>Status</span><strong>${t.state}</strong></div><div class="fact"><span>Due</span><strong style="color:#b83445">${t.due} · overdue</strong></div><div class="fact"><span>Progress</span><strong>${t.progress}%</strong></div></div><section class="section"><h3>Attachments · 2</h3><article class="attachment"><div class="attachment-top"><div><span class="pill blue">External link</span><div class="task-title" style="margin-top:7px">Board evidence workspace</div><div class="meta">https://share.example.org/audit/evidence</div></div><span class="meta">Sara · 09:42</span></div><div class="attachment-actions"><button class="soft" data-action="external">Open in new tab ↗</button></div></article><article class="attachment"><div class="attachment-top"><div><span class="pill violet">Astra-managed file</span> <span class="pill green">Final result</span><div class="task-title" style="margin-top:7px">Signed audit response.pdf</div><div class="meta">4.8 MB · SHA-256 verified · Sara · 10:06</div></div></div><div class="attachment-actions"><button class="soft" data-action="download">Download</button>${state.role==="App Owner"?`<button class="ghost" data-action="permalink">Create permanent link</button><button class="danger" data-action="remove">Remove</button>`:""}</div></article>${state.role!=="Viewer"?`<button class="primary" data-action="attach">＋ Add attachment</button>`:`<p class="meta">Viewer access · attachment controls are hidden.</p>`}</section><section class="section"><h3>Lifecycle</h3><div style="display:flex;gap:8px"><button class="primary" data-action="accept">Accept & complete</button><button class="ghost" data-action="changes">Request changes</button></div></section><section class="section"><h3>History</h3><div class="timeline-event"><i></i><div><b>Submission v3 added</b><div class="meta">Sara Karim · Today 10:06</div></div></div><div class="timeline-event"><i style="background:#e9a23b"></i><div><b>Due date revised with reason</b><div class="meta">Aly Jafferani · Yesterday 16:20</div></div></div></section></div>`;wireDrawer()}
    function wire(){
      document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
      document.querySelectorAll("[data-task]").forEach(el=>{const open=()=>{state.selected=el.dataset.task;state.drawer=true;renderDrawer()};el.onclick=open;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}}});
      document.querySelectorAll("[data-action]").forEach(b=>{if(!b.closest("#drawer"))b.onclick=()=>action(b.dataset.action)});
      const search=document.querySelector(".search input");document.onkeydown=e=>{if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();search?.focus()}};
    }
    function wireDrawer(){document.querySelectorAll("#drawer [data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action))}
    function action(name){
      if(name==="close"){state.drawer=false;renderDrawer();return}if(name==="full"){state.full=!state.full;renderDrawer();return}
      if(name==="role"){state.role=state.role==="App Owner"?"Project Manager":state.role==="Project Manager"?"Viewer":"App Owner";toast(`Prototype role: ${state.role}`);render();return}
      if(name==="remove")return dialog("Removal blocked","This attachment is a final result. Unmark it deliberately before removing the attachment record.","Unmark final result",()=>toast("Owner notified · final-result unmark simulated"),true);
      if(name==="permalink")return dialog("Create a permanent direct link?","Anyone with the generated URL can access this file outside Astra task authorization until you revoke it.","Create link",()=>toast("Permanent-link generation simulated · owner notified"),true);
      if(name==="attach")return dialog("Add attachment","Choose an external HTTPS link or upload an Astra-managed file. This prototype saves nothing.","Continue",()=>toast("Attachment flow simulated"));
      if(name==="external")return toast("External link would open with noopener + noreferrer");
      if(name==="download")return toast("Task access rechecked · authorized download simulated");
      if(name==="inbox"){toast("Inbox opened in context · 3 unread signals");return}
      if(name==="create")return dialog("Create a task","A focused creation window keeps advanced governance fields out of the first step.","Create draft",()=>toast("Draft task simulated"));
      toast(`${name.replace(/\b\w/g,c=>c.toUpperCase())} simulated · no data saved`)
    }
    function dialog(title,body,confirm,onConfirm,danger=false){const root=document.getElementById("dialog");root.hidden=false;root.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">${esc(title)}</h2><p>${esc(body)}</p><div class="actions"><button class="ghost" id="cancelDialog">Cancel</button><button class="${danger?"danger":"primary"}" id="confirmDialog">${esc(confirm)}</button></div></div>`;const close=()=>{root.hidden=true;root.innerHTML=""};root.onclick=e=>{if(e.target===root)close()};root.querySelector("#cancelDialog").onclick=close;root.querySelector("#confirmDialog").onclick=()=>{close();onConfirm?.()};root.querySelector("#cancelDialog").focus()}
    function toast(message){const t=document.createElement("div");t.className="toast";t.textContent=message;document.getElementById("toasts").appendChild(t);setTimeout(()=>t.remove(),3400)}
    function setVariant(v){state.variant=v;const u=new URL(location.href);u.searchParams.set("variant",v);history.replaceState(null,"",u);render()}
    function cycle(dir){const keys=Object.keys(variants),i=keys.indexOf(state.variant);setVariant(keys[(i+dir+keys.length)%keys.length])}
    document.getElementById("prevVariant").onclick=()=>cycle(-1);document.getElementById("nextVariant").onclick=()=>cycle(1);
    document.getElementById("showNotes").onclick=()=>{const e=document.getElementById("evaluation");e.hidden=!e.hidden;e.innerHTML=`<button class="icon-btn" style="float:right" onclick="this.parentElement.hidden=true">×</button><h2>Design evaluation</h2><p>All variants use the same work and permissions. Judge structure, not color.</p><h3>A · Command Center — recommended</h3><p>Best balance of operational density, clarity, discoverability, and delight. It extends Astra's existing shell with the least implementation risk.</p><h3>B · Focus Workspace</h3><p>Calmest and most elegant for individual work, but hides portfolio context and uses more space per task.</p><h3>C · Executive Cockpit</h3><p>Strongest first impression and leadership scan, but too dashboard-led for daily task operations. Reuse its health strip on Portfolio rather than as the default shell.</p><h3>Suggested synthesis</h3><p>Adopt A as the shell, borrow B's typography and progressive disclosure for task detail, and use C's glass health strip only on Portfolio/Home.</p>`};
    window.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1);if(e.key==="Escape"){document.getElementById("dialog").hidden=true;state.drawer=false;renderDrawer()}});
    window.addEventListener("popstate",render);render();
  })();
  </script>
</body>
</html>
